<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Aura by Vigyaan — your AI companion</title>
    <meta name="description" content="Download Aura by Vigyaan — a private AI wellness companion who actually remembers you. Free on iPhone and Android.">

    <!-- Link previews (WhatsApp / iMessage / social) -->
    <meta property="og:title" content="Aura by Vigyaan — your AI companion who remembers you">
    <meta property="og:site_name" content="Aura by Vigyaan">
    <meta property="og:description" content="Free on iPhone and Android. Check in, talk it out, feel heard — private by design.">
    <meta property="og:url" content="https://vigyaan.ai/aura/get/">
    <meta property="og:image" content="https://vigyaan.ai/assets/logo/aura-icon.png">
    <meta property="og:type" content="website">

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="../../assets/logo/aura-icon.png">
    <link rel="apple-touch-icon" href="../../assets/logo/aura-icon.png">

    <!-- Send phones straight to their store. Runs before first paint; the
         page below is the desktop/unknown-device fallback (and what link
         crawlers index). location.replace keeps Back working: the chooser
         never enters history. -->
    <script>
        (function () {
            var APPSTORE = "https://apps.apple.com/app/id6771584896";
            var PLAY = "https://play.google.com/store/apps/details?id=ai.vigyaan.aura";
            var ua = navigator.userAgent || "";
            var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/i.test(ua);
            if (isIOS) { location.replace(APPSTORE); }
            else if (isAndroid) { location.replace(PLAY); }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }

        /* The app's own breathing-space chrome: deep indigo → deep purple
           (breathing_session_screen.dart: 0xFF1E1B4B → 0xFF3B0764). */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(160deg, #1E1B4B, #3B0764);
            color: #ffffff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 2.5rem 1.5rem 1.5rem;
            overflow-x: hidden;
        }

        main { width: 100%; max-width: 25rem; text-align: center; }

        /* ── The app's REAL breathing circle (radial #A78BFA→#7C3AED,
              glow #7C3AED/50% blur 40 spread 8) breathing the calm
              4-4-6: expand on inhale, hold, long exhale — with Aura's
              icon at its center. 14s cycle, easeInOut per phase. ── */
        .hero { position: relative; width: 15rem; height: 15rem; margin: 0 auto .6rem; }
        .breath-circle {
            position: absolute; inset: 0; margin: auto;
            width: 14rem; height: 14rem; border-radius: 50%;
            background: radial-gradient(circle, #A78BFA 40%, #7C3AED 100%);
            box-shadow: 0 0 40px 8px rgba(124, 58, 237, .5);
            animation: app-breathe 14s ease-in-out infinite;
        }
        @keyframes app-breathe {
            0%     { transform: scale(.62); }
            28.6%  { transform: scale(1); }     /* inhale 4s  */
            57.1%  { transform: scale(1); }     /* hold   4s  */
            100%   { transform: scale(.62); }   /* exhale 6s  */
        }
        .hero img {
            position: absolute; inset: 0; margin: auto;
            width: 6.6rem; height: 6.6rem; border-radius: 1.5rem;
            box-shadow: 0 14px 34px rgba(30, 27, 75, .55);
        }

        /* Phase word, in the app's lavender (#C4B5FD), cycling in sync. */
        .phase { position: relative; height: 1.3rem; margin-bottom: 1.5rem; }
        .phase span {
            position: absolute; left: 0; right: 0;
            font-size: .72rem; font-weight: 600; letter-spacing: .32em;
            text-transform: uppercase; color: #C4B5FD; opacity: 0;
        }
        .phase .p-in  { animation: ph-in  14s linear infinite; }
        .phase .p-ho  { animation: ph-ho  14s linear infinite; }
        .phase .p-ex  { animation: ph-ex  14s linear infinite; }
        @keyframes ph-in { 0%,2% {opacity:0;} 6%,24% {opacity:1;} 28.6%,100% {opacity:0;} }
        @keyframes ph-ho { 0%,28.6% {opacity:0;} 32%,53% {opacity:1;} 57.1%,100% {opacity:0;} }
        @keyframes ph-ex { 0%,57.1% {opacity:0;} 61%,95% {opacity:1;} 100% {opacity:0;} }

        h1 { font-size: 2.55rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .5rem; }
        h1 .aura { color: #C4B5FD; }

        .lede { color: rgba(255,255,255,.72); line-height: 1.55; margin-bottom: 2rem; font-size: 1rem; }
        .byline { color: rgba(255,255,255,.55); font-size: .85rem; letter-spacing: .28em; text-transform: uppercase; margin: -0.6rem 0 1.1rem; }

        .buttons { display: flex; flex-direction: column; gap: .8rem; margin-bottom: .4rem; }
        .btn {
            display: flex; align-items: center; gap: .95rem;
            text-decoration: none; text-align: left;
            border-radius: 1.1rem; padding: .85rem 1.35rem;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.16);
            backdrop-filter: blur(6px);
            transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.13);
            border-color: rgba(196,181,253,.6);
            box-shadow: 0 12px 30px rgba(30,27,75,.5);
        }
        .btn svg { width: 1.7rem; height: 1.7rem; flex: none; }
        .btn .txt small {
            display: block; font-size: .68rem; font-weight: 500;
            color: rgba(255,255,255,.6); letter-spacing: .02em;
        }
        .btn .txt strong { display: block; font-size: 1.08rem; font-weight: 600; color: #fff; letter-spacing: -.01em; }

        .hint { font-size: .8rem; color: rgba(255,255,255,.45); margin-top: 1.1rem; }
        .hint a { color: rgba(255,255,255,.65); text-decoration: underline; text-underline-offset: 3px; }
        .hint a:hover { color: #C4B5FD; }

        /* ── The company, standing clearly at the bottom. ── */
        .vigyaan {
            margin-top: 2.6rem; padding-top: 1.4rem;
            border-top: 1px solid rgba(255,255,255,.12);
            display: flex; align-items: center; justify-content: center; gap: .55rem;
            text-decoration: none;
        }
        .vigyaan img { width: 1.5rem; height: 1.5rem; }
        .vigyaan .name {
            font-size: 1.02rem; font-weight: 600; letter-spacing: .12em;
            color: rgba(255,255,255,.85); text-transform: uppercase;
        }
        .vigyaan .from { font-size: .78rem; color: rgba(255,255,255,.5); }
        .vigyaan:hover .name { color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            .breath-circle { animation: none; transform: scale(.85); }
            .phase span { animation: none; }
            .phase .p-in { opacity: .8; }
        }
    </style>
</head>
<body>
    <main>
        <div class="hero">
            <div class="breath-circle"></div>
            <img src="../../assets/logo/aura-icon.png" alt="Aura app icon">

        <div class="phase" aria-hidden="true">
            <span class="p-in">breathe in</span>

            <span class="p-ex">breathe out</span>

        <h1><span class="aura">Aura</span></h1>

                <span class="txt"><small>Download on the</small><strong>App Store</strong></span>
            </a>
            <a class="btn" href="https://play.google.com/store/apps/details?id=ai.vigyaan.aura">
                <svg viewBox="0 0 512 512" aria-hidden="true"><path fill="#34d399" d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
                <span class="txt"><small>Get it on</small><strong>Google Play</strong></span>

        <p class="hint">
            On your phone? You'll be taken straight to your store.

        </p>

        <a class="vigyaan" href="https://vigyaan.ai">
            <img src="../../assets/logo/vigyaan-icon.svg" alt="Vigyaan logo">
            <span class="name">Vigyaan</span>
            <span class="from">· the company behind Aura</span>
        </a>
    </main>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
