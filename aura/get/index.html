<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Aura — your AI companion</title>
    <meta name="description" content="Download Aura by Vigyaan — a private AI wellness companion who actually remembers you. Free on iPhone and Android.">

    <!-- Link previews (WhatsApp / iMessage / social) -->
    <meta property="og:title" content="Aura — your AI companion who remembers you">
    <meta property="og:description" content="Free on iPhone and Android. Check in, talk it out, feel heard — private by design.">
    <meta property="og:url" content="https://vigyaan.ai/aura/get/">

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="../../assets/logo/aura-icon.png">
    <link rel="apple-touch-icon" href="../../assets/logo/aura-icon.png">

    <!-- Send phones straight to their store. Runs before first paint; the
         page below is the desktop/unknown-device fallback (and what link
         crawlers index). location.replace keeps Back working: the chooser
         never enters history. -->
    <script>
        (function () {
            var APPSTORE = "https://apps.apple.com/app/id6771584896";
            var PLAY = "https://play.google.com/store/apps/details?id=ai.vigyaan.aura";
            var ua = navigator.userAgent || "";
            var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/i.test(ua);
            if (isIOS) { location.replace(APPSTORE); }
            else if (isAndroid) { location.replace(PLAY); }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a16;
            color: #e7e7f2;
            display: flex; align-items: center; justify-content: center;
            padding: 2rem 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        /* ── Ambient night: two soft colour fields + faint stars ── */
        body::before, body::after {
            content: ""; position: fixed; border-radius: 50%;
            filter: blur(90px); pointer-events: none; z-index: 0;
        }
        body::before {
            width: 34rem; height: 34rem; top: -12rem; left: -10rem;
            background: radial-gradient(circle, rgba(139,92,246,.28), transparent 65%);
        }
        body::after {
            width: 30rem; height: 30rem; bottom: -12rem; right: -8rem;
            background: radial-gradient(circle, rgba(96,165,250,.16), transparent 65%);
        }
        .stars {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.5), transparent 100%),
                radial-gradient(1px 1px at 78% 14%, rgba(255,255,255,.35), transparent 100%),
                radial-gradient(1.5px 1.5px at 62% 80%, rgba(255,255,255,.3), transparent 100%),
                radial-gradient(1px 1px at 28% 68%, rgba(255,255,255,.4), transparent 100%),
                radial-gradient(1px 1px at 88% 55%, rgba(255,255,255,.3), transparent 100%),
                radial-gradient(1.5px 1.5px at 45% 10%, rgba(255,255,255,.28), transparent 100%);
        }

        main { position: relative; z-index: 1; width: 100%; max-width: 26rem; text-align: center; }

        /* ── The hero: Aura's REAL icon, breathing ripples outward —
              the same rings the icon itself is drawn from. 14s cadence:
              inhale, gentle hold, long exhale. ── */
        .hero { position: relative; width: 13rem; height: 13rem; margin: 0 auto 1.4rem; }
        .hero .halo {
            position: absolute; inset: -18%; border-radius: 50%;
            background: radial-gradient(circle, rgba(139,92,246,.38), rgba(139,92,246,.10) 55%, transparent 70%);
            filter: blur(14px);
            animation: swell 14s ease-in-out infinite;
        }
        .hero .ripple {
            position: absolute; inset: 8%; border-radius: 50%;
            border: 1.5px solid rgba(196,181,253,.55);
            opacity: 0;
            animation: ripple 14s ease-out infinite;
        }
        .hero .ripple.r2 { animation-delay: 1.1s; border-color: rgba(167,139,250,.4); }
        .hero .ripple.r3 { animation-delay: 2.2s; border-color: rgba(139,92,246,.3); }
        .hero img {
            position: absolute; inset: 0; margin: auto;
            width: 8.25rem; height: 8.25rem; border-radius: 1.9rem;
            box-shadow:
                0 22px 55px rgba(109,40,217,.45),
                0 4px 14px rgba(0,0,0,.5);
            animation: swell 14s ease-in-out infinite;
        }
        @keyframes swell {
            0%, 100% { transform: scale(1); }
            28%      { transform: scale(1.05); }  /* inhale  */
            56%      { transform: scale(1.05); }  /* hold    */
        }
        @keyframes ripple {
            0%   { transform: scale(.72); opacity: 0; }
            22%  { opacity: .8; }
            60%  { transform: scale(1.28); opacity: 0; }
            100% { transform: scale(1.28); opacity: 0; }
        }

        .eyebrow {
            font-size: .68rem; font-weight: 600; letter-spacing: .3em;
            text-transform: uppercase; color: #8d8bb0;
            animation: soften 14s ease-in-out infinite;
            margin-bottom: 1.6rem;
        }
        @keyframes soften { 0%,100% { opacity:.5; } 28%,56% { opacity:1; } }

        h1 { font-size: 2.6rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .55rem; }
        h1 .aura {
            background: linear-gradient(120deg, #c4b5fd, #8b5cf6 45%, #60a5fa);
            background-size: 200% 200%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: shimmer 9s ease-in-out infinite;
        }
        @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .lede { color: #b9b7cf; line-height: 1.55; margin-bottom: 2.2rem; font-size: 1.02rem; }

        .buttons { display: flex; flex-direction: column; gap: .8rem; }
        .btn {
            display: flex; align-items: center; gap: .95rem;
            text-decoration: none; text-align: left;
            border-radius: 1.1rem; padding: .85rem 1.3rem;
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.12);
            transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.09);
            border-color: rgba(196,181,253,.45);
            box-shadow: 0 10px 30px rgba(109,40,217,.25);
        }
        .btn svg { width: 1.7rem; height: 1.7rem; flex: none; }
        .btn .txt small {
            display: block; font-size: .68rem; font-weight: 500;
            color: #a3a1bd; letter-spacing: .02em;
        }
        .btn .txt strong { display: block; font-size: 1.08rem; font-weight: 600; color: #ffffff; letter-spacing: -.01em; }

        .btn.watch {
            justify-content: center; text-align: center;
            background: transparent; border-color: rgba(255,255,255,.10);
            padding: .8rem 1.3rem; color: #b9b7cf; font-size: .93rem; font-weight: 500;
            gap: .6rem;
        }
        .btn.watch:hover { color: #fff; box-shadow: none; }
        .btn.watch svg { width: 1.15rem; height: 1.15rem; }

        .foot { margin-top: 2.4rem; font-size: .82rem; color: #706e8f; line-height: 1.9; }
        .foot a { color: #8d8bb0; text-decoration: underline; text-underline-offset: 3px; }
        .foot a:hover { color: #c4b5fd; }
        .lockup { display: inline-flex; align-items: center; gap: .4rem; }
        .lockup img { width: .95rem; height: .95rem; opacity: .8; }

        @media (prefers-reduced-motion: reduce) {
            .halo, .ripple, .hero img, .eyebrow, h1 .aura { animation: none; }
            .ripple { opacity: .25; }
        }
    </style>
</head>
<body>

        </div>

        <p class="foot">
            On your phone? You'll be taken straight to your store.<br>
            <a href="https://vigyaan.ai/aura/">About Aura &amp; support</a>
            <span style="margin:0 .35rem">·</span>
            <span class="lockup">by <img src="../../assets/logo/vigyaan-icon.svg" alt=""> <a href="https://vigyaan.ai" style="text-decoration:none">Vigyaan</a></span>

    </main>
</body>
</html>
