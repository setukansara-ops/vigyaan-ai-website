<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vigyaan — Spark mark (monochrome)">
  <!--
    Vigyaan Spark — Monochrome / single-color
    ──────────────────────────────────────────
    Uses currentColor so the host can style it.
    Required for: embossing, single-color print, dark-on-light contexts,
    OS-level adaptive icons (Android monochrome theme), watermarks.
  -->
  <!-- Top arm -->
  <path d="M 50 14 L 55 32 L 50 50 L 45 32 Z" fill="currentColor"/>
  <!-- Bottom arm -->
  <path d="M 50 86 L 55 68 L 50 50 L 45 68 Z" fill="currentColor"/>
  <!-- Left arm -->
  <path d="M 18 50 L 32 45 L 50 50 L 32 55 Z" fill="currentColor"/>
  <!-- Right arm -->
  <path d="M 82 50 L 68 45 L 50 50 L 68 55 Z" fill="currentColor"/>
  <!-- Bindu -->
  <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
</svg>
